name: Build and Push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (without push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/zadanie2:scan

          cache-from: type=registry,ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/zadanie2-cache:main
          cache-to: type=registry,ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/zadanie2-cache:main,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/zadanie2:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/zadanie2:latest
            ghcr.io/${{ github.repository_owner }}/zadanie2:${{ github.sha }}

          cache-from: type=registry,ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/zadanie2-cache:main
          cache-to: type=registry,ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/zadanie2-cache:main,mode=max